<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The snack walk</title>
<!--
  The snack walk: the pilot of the foraging game (8 October 2026), a copy of the quick version (Version_Rapide) with a
  'pilote' build. One page, no install, nothing is sent anywhere.
  Edit Pilote.template.html, then run build_pilote.py: it puts the cards and the pictures inside and writes Pilote.html.
  Pictures: Microsoft Fluent Emoji 3D, MIT License, Copyright (c) Microsoft Corporation.
  The blue cheese was drawn for the Explorer of this project; the sushi and the tin of anchovies for this game.
-->
<style>
:root{
  --bg:#fff; --ink:#222; --muted:#666; --line:#ddd;
  --g1:#cfe7b6; --g2:#c3e0a8;
  --accent:#2f6fdf; --good:#1f9254; --bad:#cc4a3b; --warn:#e0a020;
  --sam:#2f6fdf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:18px/1.55 Arial,"Helvetica Neue",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:34px;line-height:1.1;margin:0 0 12px;letter-spacing:-.4px}
h2{font-size:22px;margin:0 0 8px}
p{margin:0 0 10px}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit}
kbd{display:inline-block;min-width:1.7em;padding:0 6px;border:1px solid #d4ccbb;border-bottom-width:2px;border-radius:6px;background:#fff;font-weight:650;font-size:13px;line-height:1.6;text-align:center;color:var(--ink)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:1200px;margin:0 auto}
.brand{font-weight:800;display:flex;align-items:center;gap:10px}
.brand img{width:26px;height:26px}
.topbtn{border:0;background:#fff;border-radius:12px;padding:7px 14px;box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:650}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px #d8d0bf;padding:8px 14px}
.btn:disabled{opacity:.4;cursor:default}

/* start */
.start{display:flex;justify-content:center;padding-top:8px}
.hero{background:#fff;border-radius:24px;padding:28px 32px;max-width:860px;width:100%;box-shadow:0 12px 40px rgba(40,30,10,.08)}
.hero-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.lead{font-size:18px}
.quick{margin:18px 0 6px;padding:16px 18px;border-radius:16px;background:#f8f6f0;display:grid;gap:10px}
.qrow{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center}
.qlabel{font-weight:650;font-size:14px}
.seg .person{background:#fff;box-shadow:inset 0 0 0 2px var(--sam);color:var(--ink)}
.seg .person.on{background:var(--sam);color:#fff}
.howto{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:8px}
.howto li{display:flex;align-items:center;gap:12px}
.howto img,.howto .ic svg{width:28px;height:28px}
.howto .ic{display:flex;width:28px;height:28px}
.keys-big{display:flex;gap:3px}
.name-field{display:flex;align-items:center;gap:12px;margin:8px 0 18px;font-weight:650}
.name-field input{flex:1;padding:10px 12px;border:1.5px solid #d8d0bf;border-radius:10px;background:#fbfaf7;font-weight:400}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.saved{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.saved h3{margin:0 0 4px;font-size:17px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sbtns{display:flex;gap:6px;flex:none}
.sbtns .btn{padding:5px 10px;font-size:13px}
.mini{display:grid;grid-template-columns:repeat(7,30px);grid-auto-rows:30px;border-radius:12px;overflow:hidden;width:max-content;background:conic-gradient(var(--g2) 25%,var(--g1) 0 50%,var(--g2) 0 75%,var(--g1) 0);background-size:60px 60px}
.mini span{display:flex;align-items:center;justify-content:center}
.mini img{width:24px;height:24px}

/* intro, panels */
.intro{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding-top:16px}
.intro-text{max-width:470px}
.continue{margin-top:18px;display:flex;align-items:center;gap:12px}
.panel{background:#fff;border-radius:22px;padding:26px 28px;max-width:720px;margin:16px auto;box-shadow:0 12px 40px rgba(40,30,10,.08);border-top:6px solid var(--sam)}

/* the card, and the panel that replaces it */
.card{width:300px;background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(40,30,10,.08);border-top:6px solid var(--sam)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px var(--ring,#d8d0bf);display:flex;align-items:center;justify-content:center;flex:none}
.avatar img{width:36px;height:36px}
.who .nm{font-weight:800;font-size:20px;line-height:1.15}
.who .sb{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.ic img,.ic svg{width:32px;height:32px}
.val{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.val.sm{font-size:14px;font-weight:700}
.pos{color:var(--good)}.neg{color:var(--bad)}.zero{color:var(--muted)}
.word{font-weight:750;font-size:15px}
.bars{display:flex;gap:2px;justify-content:flex-end;max-width:150px;flex-wrap:wrap}
.sq{display:block;width:10px;height:15px;border-radius:2px;background:var(--good)}
.sq.neg{background:var(--bad)}
.sq.nil{background:#c9c3b6;width:16px;height:3px}
.rule{margin-top:10px;font-size:13px;color:var(--muted)}
.card .back{display:none;padding:26px 6px;text-align:center;color:var(--muted)}
.card.is-hidden .face{display:none}
.card.is-hidden .back{display:block}
.card.is-hidden.peeking .face{display:block}
.card.is-hidden.peeking .back{display:none}
.swatch{width:28px;height:28px;border-radius:7px;display:block}

/* play */
.playbar{display:flex;align-items:center;gap:16px;margin:4px auto 12px;max-width:980px}
.who-mini{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.who-mini .avatar{width:32px;height:32px}
.who-mini .avatar img{width:26px;height:26px}
.progress{flex:1;height:6px;border-radius:3px;background:#e6e0d3;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sam);border-radius:3px}
.dots{flex:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:#e2dccf}
.dots i.done{background:var(--sam);opacity:.45}
.dots i.now{background:var(--sam)}
.keys{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.boardwrap{display:flex;flex-direction:column;gap:8px}
.board{position:relative;width:calc(var(--n) * var(--cell));height:calc(var(--n) * var(--cell));border-radius:16px;background:conic-gradient(var(--g2) 25%,var(--g1) 0 50%,var(--g2) 0 75%,var(--g1) 0);background-size:calc(2 * var(--cell)) calc(2 * var(--cell));box-shadow:0 10px 30px rgba(40,60,20,.12),inset 0 0 0 2px rgba(60,100,30,.18);overflow:hidden}
.tcell{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transform:translate(calc(var(--x) * var(--cell)),calc(var(--y) * var(--cell)))}
.tcell.hill{background:#c4cf98}
.tcell.hill::after{content:"";position:absolute;left:18%;right:18%;bottom:22%;height:46%;background:linear-gradient(#a8946a,#8c7650);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.75}
.tcell.water{background:#8ec9ec}
.tcell.water svg{width:100%;height:100%;display:block;opacity:.6}
.tcell.bridge{background:repeating-linear-gradient(90deg,#b98552 0 7px,#9c6c3e 7px 9px)}
.thing{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;transform:translate(calc(var(--x) * var(--cell)),calc(var(--y) * var(--cell)));transition:transform 70ms linear,opacity .3s}
.thing>img,.thing>svg{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
/* The OpenMoji drawings have a margin inside their frame: shown a little larger, above the name. */
.item>img{width:88%;height:88%;margin-top:-4%}
.thing .lab{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:10px;line-height:1.3;background:rgba(255,255,255,.9);padding:0 5px;border-radius:7px;white-space:nowrap;font-weight:650;color:#3a4150}
.item.eaten{animation:eat .32s ease-out forwards}
@keyframes eat{60%{transform:translate(calc(var(--x) * var(--cell)),calc(var(--y) * var(--cell))) scale(1.25)}100%{transform:translate(calc(var(--x) * var(--cell)),calc(var(--y) * var(--cell))) scale(.2);opacity:0}}
.item.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;box-shadow:0 0 0 3px var(--good);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(31,146,84,.3)}}
.agent{z-index:3}
.agent .ground{position:absolute;bottom:9%;left:50%;width:64%;height:20%;transform:translateX(-50%);border-radius:50%;background:var(--sam);opacity:.6}
.agent>img{position:relative;width:96%;height:96%;transform:scaleX(var(--flip,1));filter:none}
.agent .presses{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:1px;color:#5b4a2c;font-weight:800;white-space:nowrap}
.agent.strain>img{animation:strain .22s infinite}
@keyframes strain{50%{transform:scaleX(var(--flip,1)) translateY(-3px)}}
.agent.bump{animation:bump .2s}
@keyframes bump{50%{opacity:.5}}
.agent.gone{opacity:0}
/* The river, in a boat: the person stands in a boat painted in their colour; foods float on little rafts; the river's end is marked. */
.agent.inboat>img{width:64%;height:64%;margin-bottom:24%}
.agent .hull{position:absolute;left:5%;right:5%;bottom:7%;height:36%}
.agent .hull svg{width:100%;height:100%;display:block}
.board.boatmap .item::before{content:"";position:absolute;width:80%;height:80%;border-radius:50%;background:rgba(255,255,255,.62);box-shadow:0 2px 0 rgba(20,70,110,.18)}
.board.boatmap .item>img{position:relative}
.exitbar{position:absolute;pointer-events:none;z-index:2}
.exitbar.down,.exitbar.up{left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,#fff 0 7px,rgba(255,255,255,0) 7px 14px)}
.exitbar.left,.exitbar.right{top:0;bottom:0;width:7px;background:repeating-linear-gradient(0deg,#fff 0 7px,rgba(255,255,255,0) 7px 14px)}
.exitbar.down{bottom:0}.exitbar.up{top:0}.exitbar.left{left:0}.exitbar.right{right:0}
.veil{position:absolute;inset:0;z-index:6;background:rgba(245,242,234,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-weight:750;font-size:20px;text-align:center;padding:20px}
.fb{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:14px;pointer-events:none}
.fbbox{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.16);border-left:6px solid var(--good);min-width:260px;pointer-events:auto}
.fbbox.bad{border-left-color:var(--bad)}
.fbbox.plain{border-left-color:var(--sam)}
.fbbox .big{font-weight:800;font-size:18px}
.fbbox .calc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbbox .go{font-size:13px;margin-top:6px}
.face-box{display:flex;align-items:center;gap:14px}
.facepic svg{width:64px;height:64px;display:block}
.watchctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:46px}
.watchctl .go{font-size:13px;color:var(--muted)}
.timebar{height:8px;border-radius:4px;background:#e6e0d3;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--warn);transform-origin:left}
.timebar.run i{animation-name:shrink;animation-timing-function:linear;animation-fill-mode:forwards}
.timebar.stop i{animation-play-state:paused;background:#c9c3b6}
@keyframes shrink{to{transform:scaleX(0)}}

/* recall, which-would-they-eat, feeling */
.recall-grid{display:grid;gap:10px;margin:16px 0}
.recall-row{display:grid;grid-template-columns:40px 140px 1fr;gap:12px;align-items:center}
.recall-row input{width:96px;padding:8px 10px;border:1.5px solid #d8d0bf;border-radius:10px;text-align:center;font-weight:750;font-size:18px}
.wordpick{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:6px 12px;background:#f1ede4;font-weight:650;font-size:14px}
.chip.on{background:var(--ink);color:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pair button{border:0;border-radius:18px;background:#f6f3ec;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:750;font-size:18px}
.pair button:hover{background:#ece6d8}
.pair img,.pair svg{width:84px;height:84px}
.feel-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.feel-opts button{border:0;border-radius:14px;padding:18px;background:#f1ede4;font-weight:750;font-size:17px}
.feel-opts button.on{background:var(--ink);color:#fff}
/* the pilot's 7-point scale, and the last question: which character was harder */
.likert{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 8px}
.likert button{border:0;border-radius:12px;padding:10px 4px;background:#f1ede4;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:92px}
.likert button b{font-size:20px}
.likert button span{font-size:13px;line-height:1.25;color:var(--muted);text-align:center}
.likert button.on{background:var(--ink);color:#fff}
.likert button.on span{color:#fff}
@media (max-width:600px){.likert{grid-template-columns:1fr}.likert button{flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;padding:10px 16px}.likert button span{text-align:left}}
.harder{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 8px}
.harder button{border:0;border-radius:14px;padding:16px;background:#f1ede4;color:var(--ink);display:flex;align-items:center;gap:12px;font-weight:750;font-size:18px}
.harder button.on{background:var(--ink);color:#fff}
.harder button span{text-align:left}
.harder button small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.harder button.on small{color:#fff}
h2.feelq{margin:0}
/* the character on the food or the door, both visible: in the story, and in the examples to watch */
.ministory .over{position:relative;display:block;width:100%;height:100%}
.ministory .over>*{position:absolute;left:14%;top:14%;width:72%;height:72%}
.ministory .over>:last-child{left:34%;top:24%;width:66%;height:66%}
.agent.over{transform:translate(calc((var(--x) + .3) * var(--cell)),calc((var(--y) + .1) * var(--cell)))}
.agent.over>img{width:80%;height:80%}
textarea{width:100%;min-height:70px;border:1.5px solid #d8d0bf;border-radius:12px;padding:10px}

/* results */
.sum-head{max-width:1000px;margin:8px auto 0}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin:16px auto;max-width:1060px}
.sum-card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 8px 24px rgba(40,30,10,.07);border-top:6px solid var(--sam)}
.metric{display:grid;grid-template-columns:1fr auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.metric b{font-variant-numeric:tabular-nums;text-align:right}
.meter{height:8px;border-radius:4px;background:#ece6da;overflow:hidden;margin:2px 0 6px}
.meter i{display:block;height:100%;background:var(--sam)}
.kinds{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.65}
.tag{display:inline-block;font-size:12px;font-weight:700;background:#f1ede4;border-radius:999px;padding:1px 8px;margin-left:8px;color:var(--muted);vertical-align:middle}
.sum-foot{max-width:1000px;margin:0 auto}

/* settings and menu */
.modal{position:fixed;inset:0;background:rgba(20,22,30,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.sheet{background:#fff;border-radius:22px;max-width:1060px;width:100%;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.sheet.narrow{max-width:420px;margin-top:8vh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:22px 22px 0 0;z-index:2}
.sheet-head h2{margin:0}
.sheet-body{padding:6px 24px 24px}
.menu-btns{display:grid;gap:10px;padding:18px 24px 24px}
.menu-btns .btn{width:100%;text-align:left}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 6px;font-size:17px}
.field{display:grid;grid-template-columns:210px 1fr;gap:6px 16px;align-items:start;margin:10px 0}
.flabel{font-weight:650;padding-top:6px}
.help{font-size:13px;color:var(--muted);margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;border-radius:10px;padding:7px 12px;background:#efeae0;font-weight:650;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.checks img{width:22px;height:22px}
.tablewrap{overflow-x:auto}
.samtable{border-collapse:collapse;font-size:14px;min-width:900px}
.samtable th{font-size:12px;color:var(--muted);font-weight:650;text-align:center;padding:4px 6px}
.samtable td{padding:6px;text-align:center;vertical-align:top;border-top:1px solid var(--line)}
.samtable input[type=number]{width:52px;padding:5px;border:1.5px solid #d8d0bf;border-radius:8px;text-align:center;font-weight:700}
.samtable input[type=text]{width:84px;padding:5px;border:1.5px solid #d8d0bf;border-radius:8px}
.samtable .share{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.samtable .share.rare{color:var(--bad);font-weight:750}
.samtable th img{width:24px;height:24px;display:block;margin:0 auto 2px}
.samtable .off{opacity:.35}
.samtable .coh{font-size:12px;font-weight:700}
.nmcell{text-align:left!important;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:5px}
.note{font-size:13px;color:var(--muted);margin:8px 0}
@media (max-width:820px){.field,.qrow{grid-template-columns:1fr}.card{width:100%}.recall-row{grid-template-columns:40px 1fr}.recall-row>:last-child{grid-column:1/-1}}
.mini span{background:#ece9e3!important}.mini span:nth-child(even){background:#e1ddd5!important}
/* the pilot: grey town blocks, the story pages, the quiz, the practice feedback, the watched choice */
.board{--g1:#ece9e3;--g2:#e1ddd5}
.story,.quiz{max-width:780px;margin:28px auto;display:grid;gap:16px;padding:0 16px}
.story .pic{display:flex;justify-content:center;margin-bottom:6px}
.ministory{display:grid;grid-template-columns:repeat(var(--w),54px);grid-template-rows:repeat(var(--h),54px);border-radius:14px;overflow:hidden}
.ministory span{display:flex;align-items:center;justify-content:center;background:#ece9e3}
.ministory span:nth-child(even){background:#e1ddd5}
.ministory img,.ministory svg{width:72%;height:72%}
.ministory .n{font-weight:800;color:#6b7280;font-size:18px}
.tastes{display:grid;gap:8px;min-width:240px}
.trow{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px}
.trow img{width:32px;height:32px}
.quiz fieldset{border:1px solid #e1ddd5;border-radius:14px;padding:12px 16px;background:#fff}
.quiz legend{font-weight:700;padding:0 6px}
.quiz label{display:block;margin:7px 0;cursor:pointer}
.pfb{margin:10px 4px 0;font-size:17px}
.panel,.card,.sum-card{border-top:0!important}
.story .pic{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.tcard{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 6px 18px rgba(40,30,10,.06)}
.forex{font-weight:700;margin:0 0 8px}
.scap{text-align:center;color:var(--muted);margin:-6px 0 0}
.qblock{background:#fff;border-radius:14px;padding:14px 18px}
.qq{font-weight:700;margin:0 0 8px}
.watchctl{display:flex;gap:8px;align-items:center}
.took{font-weight:700;margin-right:auto}
.ptab{border-collapse:collapse;margin:8px 0 12px}.ptab td,.ptab th{border-bottom:1px solid #e5e2da;padding:6px 10px;text-align:left}
/* the pilot: no settings for the players */
#gear{display:none!important}
/* The look of a standard online experiment (Himalaya, 9 October 2026): a white page, black text, plain grey buttons
   as in jsPsych's default style (white, 1 px #ccc border, 4 px corners, #ddd on hover), a neutral grey progress bar,
   no shadows, no rounded cards, no title bar; the only colours are the characters'. The menu stays on Esc. */
.top{display:none}
main{padding-top:36px}
h1{font-size:28px;font-weight:700;letter-spacing:0;line-height:1.25}
h2{font-size:22px;font-weight:700}
.lead{font-size:18px}
.small{font-size:14px}
.btn,.btn.ghost{background:#fff;color:#222;border:1px solid #ccc;border-radius:4px;box-shadow:none;padding:7px 16px;font-weight:400;font-size:16px;line-height:1.4}
.btn:hover:not(:disabled),.btn.ghost:hover:not(:disabled){background:#ddd;border-color:#aaa}
.btn:disabled{background:#eee;color:#aaa;border-color:#ccc;opacity:1;cursor:not-allowed}
kbd{border:1px solid #bbb;border-bottom-width:1px;border-radius:3px;background:#f6f6f6;font-weight:600;font-size:13px;color:#222}
.hero,.panel,.qblock{background:none;box-shadow:none;border-radius:0;padding-left:0;padding-right:0}
.hero{max-width:680px}
main{padding-top:14px;padding-bottom:14px}
.story{margin-top:40px}
.story .who h1{margin:0}
.boardwrap .playbar{margin:0;max-width:none;width:100%}
.presskey{color:var(--muted);margin-top:22px}
.watchctl{justify-content:center}
.watchctl .presskey{margin:0}
.cornerback,.cornerbtns{position:fixed;left:16px;bottom:16px}
.cornerbtns{display:flex;gap:8px}
.cornerback,.cornerbtns .btn{font-size:13px;padding:4px 10px;color:#555}
.card,.tcard,.sum-card{background:#fff;box-shadow:none;border:1px solid #ddd!important;border-radius:4px}
.name-field input,textarea,.recall-row input{border:1px solid #ccc;border-radius:4px;background:#fff}
.who .nm{font-weight:700}
.saved{border-top:0;margin-top:28px;padding-top:0}
.saved summary{cursor:pointer;color:var(--muted);font-size:14px}
/* the board and the story's small boards: two greys, like town blocks (Himalaya, 9 October 2026) */
.board{--g1:#f2f2f2;--g2:#e0e0e0;border-radius:0;box-shadow:0 0 0 1px #bbb;background:conic-gradient(var(--g2) 25%,var(--g1) 0 50%,var(--g2) 0 75%,var(--g1) 0);background-size:calc(2 * var(--cell)) calc(2 * var(--cell))}
.ministory{border-radius:0;gap:0;background:none;border:1px solid #bbb}
.ministory span{background:#f2f2f2}
.ministory span:nth-child(even){background:#e0e0e0}
.ministory .n{font-weight:700;color:#666}
.thing>img,.thing>svg{filter:none}
.item{flex-direction:column;gap:1px}
.item>img,.item>svg{width:62%;height:62%;margin-top:0}
.thing .lab{position:static;transform:none;background:none;padding:0;font-weight:400;font-size:clamp(11px,calc(var(--cell) * .17),15px);line-height:1.15;color:#333}
.agent .ground{display:none}
.item.ring::after{box-shadow:0 0 0 2px #444;animation:none;inset:2px;border-radius:6px}
.playbar{font-size:16px}
.who-mini{font-weight:400}
.progress{height:10px;border-radius:0;background:#eee;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.progress i{background:#aaa;border-radius:0}
.count{flex:1;color:var(--muted);font-size:15px}
.keys{color:var(--muted)}
.took{font-weight:400}
.veil{background:rgba(255,255,255,.96);font-weight:400}
/* the 7-point scale as radio buttons on a line, like a standard survey scale */
.likert{gap:0;margin:26px 0 14px;position:relative}
.likert::before{content:"";position:absolute;left:7%;right:7%;top:10px;height:2px;background:#ccc}
.likert button{border:0;border-radius:0;background:none;padding:0 4px;min-height:0;gap:8px;position:relative}
.likert button b{display:none}
.likert button::before{content:"";width:20px;height:20px;border-radius:50%;border:2px solid #888;background:#fff;box-sizing:border-box}
.likert button:hover::before{border-color:#333}
.likert button.on{background:none;color:#222}
.likert button.on::before{background:#333;border-color:#333}
.likert button span,.likert button.on span{font-size:14px;color:#222}
.likert button.on span{font-weight:700}
@media (max-width:600px){.likert::before{display:none}}
.harder button{border:1px solid #ccc;border-radius:4px;background:#fff;font-weight:400}
.harder button:hover{background:#f2f2f2}
.harder button.on{background:#fff;color:#222;border:2px solid #333}
.harder button.on small{color:var(--muted)}
.harder button span{font-size:18px}
.quiz label{font-size:18px}
.qq{font-weight:700}
/* the results and the menu */
.metric{font-size:15px}
.modal{background:rgba(0,0,0,.35)}
.sheet{border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sheet-head{border-radius:6px 6px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand">The snack walk</div>
  <div><button class="topbtn hidden" id="menuBtn" type="button">Menu</button> <button class="topbtn hidden" id="gear" type="button">Settings</button></div>
</header>
<main id="app"></main>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="setTitle">Settings</h2><button class="btn" id="closeSet" type="button">Done</button></div>
    <div class="sheet-body" id="settingsBody"></div>
  </div>
</div>
<div class="modal hidden" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="sheet narrow">
    <div class="sheet-head"><h2 id="menuTitle">Menu</h2><span class="muted small"><kbd>Esc</kbd> to close</span></div>
    <div class="menu-btns" id="menuBody"></div>
  </div>
</div>

function startGame() {

    FOOD_IDS.forEach((id, k) => { shapeOf[id] = shapes[k]; });
    G = { id: Date.now().toString(36), s, shapeOf, trials: [], keys: [], recalls: [], checks: [], feels: [], started: new Date().toISOString(), flow: 0 };
    const built = buildBlocks(s);

function next() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

  if (!st || st.type === 'summary') return showSummary();
  if (st.type === 'place') return placePeople();
  setTop(true);
  if (st.type === 'story') return showStory(st.k);
  if (st.type === 'plan') return showPlan();
  if (st.type === 'ready') return showReady(st.b);
  if (st.type === 'intro') return showIntro(st.b);
  if (st.type === 'watch') return showWatch(st.b);
  if (st.type === 'check') return showCheck(st.b);
  if (st.type === 'recall') return showRecall(st.b, st.when);
  if (st.type === 'trial') return showTrial(st.b, st.i, st.phase);
  if (st.type === 'feel') return showFeel(st.b);
  if (st.type === 'harder') return showHarder();
}

/* ---- The menu: resume, restart a person, go back, skip, stop, start again ---- */
function abortCurrent() {

  G.watchToken = null;
  G.flow++;

}
function blockLabel(b) { return b.type === 'practice' ? 'the practice' : b.type === 'self' ? 'playing as yourself' : b.mind.name; }
function openMenu() {
  if (!G || !GAME_SCREENS.includes(screen)) return;
  const st = G.steps[G.k], b = st && st.b;
  if (!b) return;
  const i = G.blocks.indexOf(b);
  const prev = i > 0 ? G.blocks[i - 1] : null, nextB = i < G.blocks.length - 1 ? G.blocks[i + 1] : null;
  const btn = (id, label, ghost = true) => `<button class="btn${ghost ? ' ghost' : ''}" id="${id}" type="button">${label}</button>`;
  $('#menuBody').innerHTML = btn('mResume', 'Resume', false)
    + btn('mRestart', `Start ${esc(blockLabel(b))} again`)
    + (prev ? btn('mPrev', `Go back to ${esc(blockLabel(prev))}`) : '')
    + (nextB ? btn('mNext', `Skip to ${esc(blockLabel(nextB))}`) : '')
    + btn('mResults', 'Stop here and see the results')
    + btn('mNew', 'New game (back to the start page)');
  $('#mResume').addEventListener('click', closeMenu);
  $('#mRestart').addEventListener('click', () => jumpTo(b));
  if (prev) $('#mPrev').addEventListener('click', () => jumpTo(prev));
  if (nextB) $('#mNext').addEventListener('click', () => jumpTo(nextB, true));
  $('#mResults').addEventListener('click', () => { closeMenu(); abortCurrent(); G.stopped = true; showSummary(); });
  $('#mNew').addEventListener('click', () => { closeMenu(); abortCurrent(); persist(); showStart(); });
  $('#menu').classList.remove('hidden');
}
function closeMenu() { $('#menu').classList.add('hidden'); }
// Going to a block again starts a new attempt: the results keep only the latest attempt of each block.
function jumpTo(block, skipping) {
  closeMenu();
  abortCurrent();
  const bi = G.blocks.indexOf(block) + 1;
  if (!skipping || G.trials.some(r => r.block === bi) || G.checks.some(c => c.block === bi)) block.attempt = (block.attempt || 1) + 1;
  block.watchLog = null; block.watchAgain = 0; block.watchBack = 0;
  G.k = G.steps.findIndex(st => st.type === 'intro' && st.b === block) - 1;
  next();
}

function persist() { if (!G) return; const g = G; saveGame(exportObject()).then(where => { g.saved = where; }); }
const slug = x => String(x || 'player').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'player';
const fileBase = o => 'snack_walk_pilot_' + slug(o.player) + '_' + o.session;
// Each round also carries how playing that person felt, the note, and which character was harder, so that the CSV

function withNotes(rounds, feelings, harder) {
  const byBlock = {};
  (feelings || []).forEach(f => { byBlock[f.block + '/' + (f.attempt || 1)] = f; });
  const kind = { practice: 'practice', sam: 'as character', self: 'as yourself' };   // trial_type: also what DataPipe's validation asks for
  return rounds.map(r => { const f = byBlock[r.block + '/' + (r.attempt || 1)]; return { trial_type: kind[r.block_type] || r.block_type, ...r, felt: f ? f.felt : '', felt_label: f ? f.felt_label || '' : '', note: f ? f.note : '', harder_to_play: harder ? harder.person : '' }; });
}
function toCSV(rows) {
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  const q = v => { if (v === null || v === undefined) return ''; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

  const t = e.target;
  if (t.dataset.check) S[t.dataset.check] = t.checked;
  else if (t.dataset.food) { const set = new Set(S.foods); if (t.checked) set.add(t.dataset.food); else set.delete(t.dataset.food); S.foods = FOOD_IDS.filter(id => set.has(id)); if (!S.foods.length) S.foods = [t.dataset.food]; }
  else if (t.dataset.sam !== undefined) {
    const m = S.sams[Number(t.dataset.sam)], f = t.dataset.field;
    if (f === 'on') m.on = t.checked;
    else if (f === 'name') m.name = t.value.trim() || m.name;
    else if (f === 'cost') m.cost = clamp(Math.round(Number(t.value) || 0), 0, 5);
    else if (f.startsWith('v.')) m.v[f.slice(2)] = clamp(Math.round(Number(t.value) || 0), -10, 10);
  }
  else return;
  saveSettings(); renderSettings();
});
$('#gear').addEventListener('click', openSettings);
$('#closeSet').addEventListener('click', closeSettings);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSettings(); });
if ($('#brandImg')) $('#brandImg').src = FOODS.olive.img;

// For testing by hand or by script: the current state, and the key presses of a least-effort path to an item.
const keysFor = cells => {
  const out = [];
  let p = CUR.st.pos;
  for (const c of cells) {
    const dx = c[0] - p[0], dy = c[1] - p[1];
    const k = dx === 1 ? 'ArrowRight' : dx === -1 ? 'ArrowLeft' : dy === 1 ? 'ArrowDown' : 'ArrowUp';
    const inside = c[0] >= 0 && c[1] >= 0 && c[0] < CUR.map.N && c[1] < CUR.map.N;
    for (let n = inside ? Math.max(1, enterCost(CUR.map, c[0], c[1], dx, dy)) : 1; n > 0; n--) out.push(k);
    p = c;
  }
  return out;
};
window.__playAsSam = {
  get game() { return G; }, get settings() { return S; }, get current() { return CUR; }, get screen() { return screen; },
  route: id => (CUR ? keysFor(pathTo(CUR.map, CUR.st.pos, id) || []) : null),
  bestNow: () => (CUR && CUR.b.mind.v ? evaluate(CUR.map, effValues(CUR.b.mind, G.s), CUR.b.mind.cost).best : null),
  evaluate, crowdShares, toCSV, nearestType, teach, openMenu,
};

showStart();
})();
</script>
